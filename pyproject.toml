[project]
name = "geo-collector"
version = "0.1.0"
description = "Vertical-agnostic data-collection instrument for AI search engines"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.18.0",
    "openai>=3.0.0",
    "publicsuffix2>=2.20191221",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "serpapi>=1.0.2",
]

[tool.uv]
package = false
# The optional cleaning group (presidio, spaCy, the en_core_web_lg model, phonenumbers) runs the personal-data
# cleaning of the publish package. Not installed by default: `uv sync --group cleaning`.
default-groups = ["dev"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
cleaning = [
    "en-core-web-lg",
    "phonenumbers==9.0.41",
    "preshed==3.0.13",  # 3.0.14 cannot load the en_core_web_lg tokenizer (OverflowError in _flush_specials)
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
]
dev = [
    "datasette>=0.65.3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
